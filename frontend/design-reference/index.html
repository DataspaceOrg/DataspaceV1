/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* functional inline SVG icons opt into bounded geometry; content SVGs keep their own */
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}

<script>
const paths={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',check:'<path d="m5 12 4 4L19 6"/>',table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 15v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/>'};
const icon=n=>`<svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]||paths.table}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sales=[['1001','Oct 01','Online','128.00'],['1002','Oct 02','Retail','86.50'],['1003','Oct 03','Online','249.00'],['1004','Oct 04','Wholesale','480.00'],['1005','Oct 05','Retail','64.00'],['1006','Oct 06','Online','172.50']];
let datasets=[{id:'retail',name:'Retail sales',file:'retail_sales.csv',type:'CSV',size:'2.4 KB',date:'Oct 22, 2026',sample:true,tables:[{name:'transactions',cols:['order_id','date','channel','revenue'],rows:sales},{name:'channels',cols:['channel','region'],rows:[['Online','Global'],['Retail','Taipei'],['Wholesale','Taipei']]}]},{id:'products',name:'Product catalog',file:'product_catalog.csv',type:'CSV',size:'1.8 KB',date:'Oct 21, 2026',sample:true,tables:[{name:'products',cols:['sku','product','category','price'],rows:[['P001','Desk lamp','Lighting','79'],['P002','Notebook','Stationery','12'],['P003','Desk tray','Accessories','24'],['P004','Bookend','Accessories','32']]}]},{id:'operations',name:'Store operations',file:'store_operations.sqlite',type:'SQLite',size:'24 KB',date:'Oct 20, 2026',sample:true,tables:[{name:'inventory',cols:['sku','location','quantity'],rows:[['P001','Taipei','28'],['P002','Taipei','146'],['P003','Taichung','52']]},{name:'locations',cols:['name','city'],rows:[['Main store','Taipei'],['Second store','Taichung']]},{name:'suppliers',cols:['name','lead_days'],rows:[['Sample supplier A','7'],['Sample supplier B','14']]}]},{id:'customers',name:'Customer directory',file:'customers.csv',type:'CSV',size:'980 B',date:'Oct 18, 2026',sample:true,tables:[{name:'customers',cols:['customer_id','segment','city'],rows:[['C001','Individual','Taipei'],['C002','Business','Taichung'],['C003','Individual','Kaohsiung'],['C004','Business','Taipei']]}]}];
let view='library',query='',filter='all',currentId='retail',tableIndex=0,tab='preview',busy=false,uploadBusy=false,pickedFile=null,returnFocus=null,toastTimer;
let analysisError=false; const results={}; const contexts={}; const main=document.getElementById('main'); const dialog=document.getElementById('upload-dialog');
const current=()=>datasets.find(d=>d.id===currentId)||datasets[0];const key=()=>currentId+':'+tableIndex;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3500)}
function nav(){document.getElementById('nav-library').innerHTML=icon('grid')+'<span>Datasets</span><span class="count">'+datasets.length+'</span>';document.getElementById('nav-insights').innerHTML=icon('spark')+'<span>Insights</span>';document.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===(view==='detail'?'library':view);b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.getElementById('crumb').textContent=view==='detail'?current().name:view==='insights'?'Insights':'Datasets'}
function go(next){view=next;render();window.scrollTo(0,0);main.querySelector('h1')?.focus({preventScroll:true})}
function openDataset(id){currentId=id;tableIndex=0;tab='preview';go('detail')}
function render(){nav();if(view==='detail')renderDetail();else if(view==='insights')renderInsights();else renderLibrary()}
function renderLibrary(){main.innerHTML=`<div class="view"><div class="page-head"><h1 tabindex="-1">Datasets</h1><button class="btn primary" data-upload>${icon('plus')} Upload dataset</button></div><section aria-label="Dataset library"><div class="library-bar"><div class="tools"><label class="search">${icon('search')}<input id="search" type="search" placeholder="Search datasets" aria-label="Search datasets" value="${esc(query)}"></label><select id="type-filter" aria-label="Filter by file type"><option value="all">All types</option><option value="CSV">CSV</option><option value="SQLite">SQLite</option></select></div></div><div class="dataset-list"><div class="list-header" aria-hidden="true"><span>Name</span><span class="type-col">Format</span><span class="rows-col">Tables</span><span class="status-col">Added</span><span></span></div><div id="dataset-rows"></div></div></section></div>`;document.getElementById('type-filter').value=filter;renderRows()}
function renderRows(){const matches=datasets.filter(d=>(filter==='all'||d.type===filter)&&(d.name+' '+d.file).toLowerCase().includes(query.toLowerCase()));document.getElementById('dataset-rows').innerHTML=!datasets.length?'<div class="empty"><h3>No datasets yet</h3><p>Upload a CSV or SQLite file to get started.</p><button class="btn primary" data-upload>Upload dataset</button></div>':matches.length?matches.map(d=>`<button class="dataset-row" data-open="${esc(d.id)}" aria-label="Open ${esc(d.name)}"><span class="od-row" style="gap:16px"><span class="file-icon">${d.type==='CSV'?'CSV':'SQL'}</span><span class="od-field od-fill"><span class="dataset-title od-truncate">${esc(d.name)}</span><span class="file-detail od-truncate">${d.sample?'Sample data':'Session upload'} · ${esc(d.size)}</span></span></span><span class="type-col tag">${d.type}</span><span class="rows-col muted">${d.tables.length}</span><span class="status-col muted">${esc(d.date)}</span>${icon('chevron')}</button>`).join(''):`<div class="empty">${icon('search')}<h3>No matching datasets</h3><p>Try a different name or file type.</p><button class="btn" id="clear-search">Clear filters</button></div>`}
function renderDetail(){const d=current(),t=d.tables[tableIndex],r=results[key()];main.innerHTML=`<div class="view"><button class="btn plain back" data-view="library">${icon('back')} All datasets</button><div class="detail-head"><h1 tabindex="-1">${esc(d.name)}</h1><div class="detail-meta"><span>${esc(d.file)}</span><span>${d.type} · ${esc(d.size)}</span><span>${d.sample?'Sample data':'Session upload'}</span></div></div><div class="workspace"><aside class="table-nav"><h3>Tables · ${d.tables.length}</h3><div class="table-options">${d.tables.map((a,i)=>`<button class="table-choice ${i===tableIndex?'selected':''}" data-table="${i}" aria-pressed="${i===tableIndex}">${icon('table')}<span class="od-field"><span style="overflow-wrap:anywhere">${esc(a.name)}</span><small>${a.unparsed?'Structure not parsed':a.rows.length+' rows · '+a.cols.length+' columns'}</small></span></button>`).join('')}</div></aside><div class="workspace-main"><section class="panel"><div class="panel-heading"><div><h2>${esc(t.name)}</h2></div><div class="segmented" aria-label="Table view"><button data-tab="preview" class="${tab==='preview'?'selected':''}" aria-pressed="${tab==='preview'}">Preview</button><button data-tab="schema" class="${tab==='schema'?'selected':''}" aria-pressed="${tab==='schema'}">Schema</button></div></div>${tableMarkup(t)}<p class="muted" style="font-size:12px;margin-top:16px">${t.unparsed?'SQLite inspection requires the backend. No file contents have been inferred.':`Showing ${Math.min(t.rows.length,5)} of ${t.rows.length} rows${d.sample?' · Sample data':''}`}</p></section><section class="panel" aria-labelledby="analysis-heading"><div class="steps"><span class="step ${!r?.insight?'active':''}"><span class="step-num">${r?.insight?'✓':'1'}</span>Initial insight</span><span class="step ${r?.insight?'active':''}"><span class="step-num">2</span>Aggregation</span></div><h2 id="analysis-heading">Analysis</h2><p class="analysis-intro">Simulated analysis · no AI service connected.</p><div class="field"><label for="context">Additional context <span>— optional</span></label><textarea id="context" placeholder="What is this data about? What would you like to understand?">${esc(contexts[key()]||'')}</textarea></div><div class="run-row"><p>${r?.aggregation?'Aggregations complete':r?.insight?'Initial insight complete':' '}</p><button class="btn primary" id="run-analysis" ${busy?'disabled':''}>${icon('spark')} ${busy?'Analyzing…':r?.aggregation?'Run again':r?.insight?'Create aggregations':'Run initial insight'}</button></div><div id="analysis-output" aria-live="polite">${analysisError?'<div class="analysis-result"><p class="error" role="alert">Analysis could not be completed. Your table and context are unchanged.</p><button class="btn" id="retry-analysis">Try again</button></div>':busy?'<div class="loading-note">Preparing a simulated analysis…<div class="progress"><span style="width:65%"></span></div></div>':resultMarkup(r,t)}</div></section></div></div></div>`}
function tableMarkup(t){if(t.unparsed)return '<div class="empty" style="padding:28px 12px"><h3>SQLite file added</h3><p>Connect the backend to discover its tables and preview its schema.</p></div>';if(tab==='schema')return `<div class="table-scroll"><table><thead><tr><th>Column</th><th>Detected type</th><th>Missing values</th></tr></thead><tbody>${t.cols.map((c,i)=>{const vals=t.rows.map(r=>r[i]||'');const nonempty=vals.filter(Boolean);const numeric=nonempty.length&&nonempty.every(x=>Number.isFinite(Number(x)));return `<tr><td class="mono">${esc(c)}</td><td>${numeric?'Number':'Text'}</td><td>${vals.filter(x=>!x).length}</td></tr>`}).join('')}</tbody></table></div>`;return `<div class="table-scroll" tabindex="0" role="region" aria-label="Data preview, scroll horizontally for more columns"><table><thead><tr>${t.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${t.rows.slice(0,5).map(row=>`<tr>${t.cols.map((_,i)=>`<td>${esc(row[i]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function resultMarkup(r,t){if(!r)return '';return `<div class="analysis-result"><div class="result-heading">${icon('spark')}<h3>Initial insight</h3><span class="tag">Simulated</span></div><p>${t.unparsed?'The file is ready for a future backend connection. Its contents have not been inspected.':`This table contains ${t.rows.length} records across ${t.cols.length} columns. Start by checking completeness and comparing repeated categories.`}</p>${!t.unparsed?`<ul><li>Available fields: ${esc(t.cols.join(', '))}.</li><li>${t.rows.some(row=>t.cols.some((_,i)=>!row[i]))?'Some records have missing values. Review them before comparing totals.':'No empty fields were detected in the parsed records.'}</li><li>Confirm field meanings and units before drawing conclusions.</li></ul>`:''}${r.aggregation?`<div class="insight-callout"><strong>Aggregation suggestions · Simulated</strong><p style="margin:8px 0 0">${t.unparsed?'After backend integration, group records by a category and summarize numeric fields.':`Count records by ${esc(t.cols[0]||'category')}; compare numeric totals where appropriate; review empty values by field.`}</p></div>`:''}</div>`}
function renderInsights(){const entries=Object.entries(results).filter(([,r])=>r.insight);main.innerHTML=`<div class="view"><div class="page-head"><div><h1 tabindex="-1">Insights</h1></div></div>${entries.length?`<div class="insight-grid">${entries.map(([k,r])=>{const [id,idx]=k.split(':');const d=datasets.find(d=>d.id===id);return `<article class="panel insight-card"><span class="tag">Simulated analysis</span><h2>${esc(d.name)}</h2><p>${esc(d.tables[Number(idx)].name)} · Initial insight${r.aggregation?' + aggregation suggestions':''}</p><button class="btn" data-result="${esc(k)}">Open analysis ${icon('arrow')}</button></article>`}).join('')}</div>`:`<section class="panel empty">${icon('spark')}<h2 style="margin:16px 0 12px">No insights yet</h2><p>Select a dataset to run an initial insight.</p><button class="btn primary" data-open="retail">Select dataset</button></section>`}</div>`}
function showUpload(trigger){returnFocus=trigger;dialog.showModal();setTimeout(()=>document.getElementById('file-input').focus(),0)}
function closeUpload(){if(uploadBusy)return;dialog.close();if(returnFocus?.isConnected)returnFocus.focus();else document.querySelector('[data-upload]')?.focus()}
function showError(msg){const e=document.getElementById('upload-error');e.textContent=msg;e.hidden=false}
function chooseFile(file){document.getElementById('upload-error').hidden=true;pickedFile=null;document.getElementById('confirm-upload').disabled=true;if(!file)return;if(!/\.(csv|db|sqlite|sqlite3)$/i.test(file.name)){showError('Choose a CSV or SQLite file (.csv, .db, .sqlite, .sqlite3).');return}if(file.size>20*1024*1024){showError('This file is over 20 MB. Choose a smaller file for this prototype.');return}if(!file.size){showError('This file is empty. Choose a file that contains data.');return}pickedFile=file;document.getElementById('dataset-name').value=file.name.replace(/\.[^.]+$/,'').replace(/[_-]/g,' ');const info=document.getElementById('file-info');info.textContent=file.name+' · '+formatBytes(file.size);info.hidden=false;document.getElementById('confirm-upload').disabled=false}
function formatBytes(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('A quoted field is not closed. Fix the CSV and try again.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw Error('Include a header row and at least one data row in your CSV.');const cols=rows.shift().map((c,i)=>c.trim()||'Column '+(i+1));if(rows.some(r=>r.length!==cols.length))throw Error('Some rows have a different number of columns. Check the CSV formatting and try again.');return {name:'imported_data',cols,rows}}
async function addDataset(){if(!pickedFile||uploadBusy)return;const name=document.getElementById('dataset-name').value.trim();if(!name){showError('Give your dataset a name before adding it.');document.getElementById('dataset-name').focus();return}uploadBusy=true;['confirm-upload','cancel-upload','close-upload','file-input','dataset-name'].forEach(id=>document.getElementById(id).disabled=true);document.getElementById('upload-error').hidden=true;document.getElementById('upload-progress').hidden=false;document.getElementById('progress-fill').style.width='35%';try{const file=pickedFile;const isCSV=/\.csv$/i.test(file.name);const table=isCSV?parseCSV(await file.text()):{name:'SQLite file',cols:[],rows:[],unparsed:true};document.getElementById('progress-fill').style.width='100%';const d={id:'upload-'+Date.now(),name,file:file.name,type:isCSV?'CSV':'SQLite',size:formatBytes(file.size),date:'Just added',sample:false,tables:[table]};datasets.unshift(d);currentId=d.id;tableIndex=0;tab='preview';dialog.close();view='detail';render();main.querySelector('h1')?.focus();toast('Dataset added to this browser session');pickedFile=null;document.getElementById('file-input').value='';document.getElementById('dataset-name').value='';document.getElementById('file-info').hidden=true}catch(e){showError(e.message||'The file could not be read. Please choose it again.')}finally{uploadBusy=false;['cancel-upload','close-upload','file-input','dataset-name'].forEach(id=>document.getElementById(id).disabled=false);document.getElementById('confirm-upload').disabled=!pickedFile;document.getElementById('upload-progress').hidden=true}}
main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-upload'))showUpload(b);else if(b.dataset.open)openDataset(b.dataset.open);else if(b.dataset.view)go(b.dataset.view);else if(b.dataset.table!==undefined){tableIndex=Number(b.dataset.table);renderDetail();main.querySelector(`[data-table="${tableIndex}"]`)?.focus()}else if(b.dataset.tab){tab=b.dataset.tab;renderDetail();main.querySelector(`[data-tab="${tab}"]`)?.focus()}else if(b.dataset.result){const [id,idx]=b.dataset.result.split(':');currentId=id;tableIndex=Number(idx);go('detail')}else if(b.id==='clear-search'){query='';filter='all';renderLibrary();document.getElementById('search').focus()}else if(b.id==='retry-analysis'){analysisError=false;renderDetail();document.getElementById('run-analysis')?.focus()}else if(b.id==='run-analysis'&&!busy){const k=key();busy=true;renderDetail();setTimeout(()=>{const old=results[k]||{};results[k]={insight:true,aggregation:!!old.insight};busy=false;if(view==='detail'&&key()===k){renderDetail();document.getElementById('run-analysis').focus()}else if(view==='insights')renderInsights();toast(old.insight?'Simulated aggregation suggestions ready':'Simulated initial insight ready')},1100)}});
main.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;renderRows()}if(e.target.id==='context')contexts[key()]=e.target.value});main.addEventListener('change',e=>{if(e.target.id==='type-filter'){filter=e.target.value;renderRows()}});document.querySelector('.sidebar').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)go(b.dataset.view)});document.getElementById('brand').addEventListener('click',e=>{e.preventDefault();go('library')});document.getElementById('close-upload').innerHTML=icon('close');document.getElementById('upload-glyph').innerHTML=icon('upload');document.getElementById('close-upload').onclick=closeUpload;document.getElementById('cancel-upload').onclick=closeUpload;document.getElementById('confirm-upload').onclick=addDataset;document.getElementById('file-input').onchange=e=>chooseFile(e.target.files[0]);document.getElementById('dataset-name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addDataset()}});dialog.addEventListener('cancel',e=>{e.preventDefault();closeUpload()});const drop=document.getElementById('dropzone');drop.addEventListener('dragover',e=>{e.preventDefault();if(!uploadBusy)drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');if(!uploadBusy)chooseFile(e.dataTransfer.files[0])});
function publicScreen(screen){if(screen==='landing'){location.replace('landing-v2.html');return;}document.querySelector('.app').hidden=true;let el=document.getElementById('public-page');if(!el){el=document.createElement('div');el.id='public-page';el.className='public-page';document.body.append(el)}const signup=screen==='signup';el.innerHTML=`<header class="public-nav"><a class="brand" href="?screen=landing"><span class="brand-mark">d.</span>dataspace</a><nav class="public-links" aria-label="Account"><a href="?screen=login">Log in</a><a class="btn" href="?screen=signup">Create account</a></nav></header>${screen==='landing'?`<main class="landing"><h1>Store and explore your datasets.</h1><p>Upload CSV or SQLite files, inspect tables, and analyze your data in one workspace.</p><a class="btn primary" href="?screen=signup">Create account</a><section class="panel" aria-label="Example dataset"><div class="panel-heading"><h2>Retail sales</h2><span class="tag">Sample data</span></div>${tableMarkup(datasets[0].tables[0])}</section></main>`:`<main class="auth-wrap"><h1>${signup?'Create account':'Log in'}</h1>${signup?'<div class="field"><label for="auth-name">Username</label><input id="auth-name" autocomplete="username" required></div>':''}<div class="field"><label for="auth-email">Email</label><input type="email" id="auth-email" autocomplete="email" required></div><div class="field"><label for="auth-password">Password</label><input type="password" id="auth-password" autocomplete="${signup?'new-password':'current-password'}" required></div><p id="auth-error" class="error" hidden role="alert"></p><button class="btn primary" id="auth-submit">${signup?'Create account':'Log in'}</button><p class="auth-switch">${signup?'Already have an account? <a href="?screen=login">Log in</a>':'<a href="?screen=signup">Create account</a>'}</p><p class="auth-note">Design mockup. No account is created or authenticated.</p></main>`}`;const submit=el.querySelector('#auth-submit');if(submit){function enter(){const inputs=[...el.querySelectorAll('input')];if(!inputs.every(input=>input.reportValidity()))return;el.remove();document.querySelector('.app').hidden=false;go('library');toast('Opened sample workspace · no authentication performed')}submit.onclick=enter;el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();enter()}})}}
const requestedScreen=new URLSearchParams(location.search).get('screen')||'library';
function initializeScreen(screen){
 if(['landing','login','signup'].includes(screen)){publicScreen(screen);return}
 if(screen==='library-empty')datasets=[];
 if(screen==='library-no-results')query='No matching dataset';
 if(screen==='library-loading'||screen==='library-error'){render();main.innerHTML=`<div class="page-head"><h1>Datasets</h1></div><section class="panel" aria-live="polite">${screen==='library-loading'?'<p class="muted">Loading datasets…</p><div class="skeleton"></div><div class="skeleton" style="max-width:65%"></div><div class="skeleton"></div>':'<h2>Datasets could not be loaded</h2><p class="muted" style="margin:16px 0">Try loading the list again.</p><button class="btn" id="retry-library">Retry</button>'}</section>`;document.getElementById('retry-library')?.addEventListener('click',()=>go('library'));return}
 if(screen.startsWith('detail')||screen.startsWith('analysis')||screen==='schema'||screen==='aggregation'||screen==='sqlite'){
 view='detail';if(screen==='schema')tab='schema';if(screen==='sqlite'){datasets.push({id:'sqlite-unparsed',name:'Uploaded database',file:'database.sqlite',type:'SQLite',size:'24 KB',sample:false,tables:[{name:'SQLite file',cols:[],rows:[],unparsed:true}]});currentId='sqlite-unparsed'}
 if(['analysis-complete','aggregation'].includes(screen))results[key()]={insight:true,aggregation:screen==='aggregation'};
 if(screen==='analysis-loading')busy=true;
 if(screen==='analysis-error')analysisError=true;
 }
 if(screen==='insights'||screen==='insights-empty'){view='insights';if(screen==='insights')results[key()]={insight:true,aggregation:true}}
 render();
 if(screen.startsWith('upload')){showUpload(document.querySelector('[data-upload]'));if(screen==='upload-selected'||screen==='upload-success'||screen==='upload-progress'){document.getElementById('dataset-name').value='Monthly sales';const info=document.getElementById('file-info');info.hidden=false;info.textContent='monthly_sales.csv · 2.4 KB'}if(screen==='upload-error')showError('Choose a CSV or SQLite file (.csv, .db, .sqlite, .sqlite3).');if(screen==='upload-progress'){document.getElementById('upload-progress').hidden=false;document.getElementById('progress-fill').style.width='60%';document.getElementById('upload-status').textContent='Processing file…'}if(screen==='upload-success'){dialog.close();openDataset('retail');toast('Dataset added · example success state')}}
}
initializeScreen(requestedScreen);
</script></body></html>
